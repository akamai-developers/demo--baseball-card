[project]
name = "card-comps"
version = "0.5.0"
description = "Nearest-neighbour comps over a table of Statcast hitters, and the script that fetches it."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comps"]
