[project]
name = "card-render"
version = "0.4.0"
description = "The card: compositor, templates, font, styles, and the Chromium renderer."
requires-python = ">=3.12"
# The mask arithmetic, the drawn stadium and the plain-wall matte. This is all
# the model services need.
dependencies = [
    "pillow>=11.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The renderer, and OpenCV for the compositor's shadow. Only the api installs
# this: only the api composes and renders a card, and only it has Chromium.
render = [
    "jinja2>=3.1",
    "playwright>=1.47",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card"]
