[project]
name = "card-art"
version = "0.8.1"
description = "Paints the stadium behind the person. FLUX.2 klein in real mode, a drawn park in mock mode."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "card-render",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11.0",
    "numpy>=2.0",
]

# The FLUX.2 [klein] backend. Not installed in the mock image, which has no
# torch in it at all. services/vision-base.Dockerfile installs torch first, and
# the real image installs everything else at the versions uv.lock holds.
#
# diffusers is pinned to a minor version on purpose. Flux2KleinPipeline landed
# in 0.40.0, so the API around it is young enough that "whatever is newest" is
# not a pin.
#
# transformers is here for the text encoder, a Qwen3 (Qwen3ForCausalLM in the
# model's model_index.json). It has to be 5.x: diffusers 0.40 requires
# huggingface-hub>=1.23, every transformers 4.x requires huggingface-hub<1.0,
# and transformers 5.x requires >=1.3. So the art service runs transformers 5
# and the cutout service runs transformers 4, which is fine because they are two
# images. The root pyproject.toml declares that as a conflict, so one lock file
# can hold both.
#
# accelerate is what from_pretrained uses to load 16 GB of weights without a
# second copy in host memory, and what the CPU offload is built on.
[project.optional-dependencies]
real = [
    "torch>=2.6",
    "diffusers>=0.40,<0.41",
    "transformers>=5.0,<6",
    "accelerate>=1.0",
    "safetensors>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/art"]
