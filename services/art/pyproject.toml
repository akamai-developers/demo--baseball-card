[project]
name = "card-art"
version = "0.3.0"
description = "Paints the stadium behind the person. FLUX.2 klein in real mode, a drawn park in mock mode."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "card-render",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/art"]
