[project]
name = "card-llm-mock"
version = "0.4.0"
description = "Stands in for vLLM on a laptop. Same routes, same bearer key, no weights."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_mock"]
