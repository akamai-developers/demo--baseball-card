[project]
name = "card-cutout"
version = "0.3.0"
description = "Cuts the person out of the photo. BiRefNet in real mode, a matte in mock mode."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "card-render",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutout"]
