[project]
name = "card-gpu-stats"
version = "0.3.0"
description = "Reads nvidia-smi and answers GET /gpu."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_stats"]
