[project]
name = "card-api"
version = "0.3.0"
description = "The orchestrator. Takes a photo and stats, returns a baseball card."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "card-render[render]",
    "card-comps",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
