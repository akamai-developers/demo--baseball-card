[project]
name = "card-api"
version = "0.2.0"
description = "The orchestrator. Takes a photo and stats, returns a baseball card."
requires-python = ">=3.12"
dependencies = [
    "card-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
